name: SASAN Native Android independent build
on:
  push:
    branches: [feature/sasan-native-android]
    paths: ['sasan-native/**', '.github/workflows/sasan-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 36 SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download and verify sing-box library
        run: |
          mkdir -p sasan-native/app/libs
          curl -fL --retry 3 'https://github.com/singbox-android/libbox/releases/download/1.14.0/libbox.aar' -o sasan-native/app/libs/libbox.aar
          echo '13fbeabcb4622250762afa1b137daaba861a4dc1875643d18621339912f32330  sasan-native/app/libs/libbox.aar' | sha256sum -c -
      - name: Build custom native Android app
        working-directory: sasan-native
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Inspect APK
        run: |
          mkdir dist
          APK=sasan-native/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          python3 sasan-native/tools/audit_apk.py "$APK" "$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|native-code:)'
          cp "$APK" dist/SASAN-Native-Android9-test.apk
          (cd dist && sha256sum SASAN-Native-Android9-test.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: SASAN-Native-Android9-test
          path: dist
          retention-days: 7
