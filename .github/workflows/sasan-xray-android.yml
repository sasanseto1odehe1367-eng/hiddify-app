name: SASAN Xray VPN - Android test APK

on:
  push:
    branches:
      - feature/sasan-xray-vpn-android
    paths:
      - "sasan-xray/**"
      - ".github/workflows/sasan-xray-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sasan-xray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build standalone Xray Android app
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Get SASAN branding scripts
        uses: actions/checkout@v4

      - name: Fetch independent v2rayNG source at a pinned revision
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          cd upstream
          git remote add origin https://github.com/2dust/v2rayNG.git
          git fetch --depth=1 origin 0f961c54c8c9f85c5271778653340025d33772cc
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "0f961c54c8c9f85c5271778653340025d33772cc"
          git submodule update --init --recursive --depth 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install NDK 30 and compile independent HEV tun engine
        shell: bash
        run: |
          set -euo pipefail
          echo 'y' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;30.0.16248370"
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          test -x "$NDK_HOME/ndk-build"
          cd upstream
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/

      - name: Fetch pinned upstream Xray Android core
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 2 \
            'https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.21/libv2ray.aar' \
            -o upstream/V2rayNG/app/libs/libv2ray.aar
          test "$(stat -c '%s' upstream/V2rayNG/app/libs/libv2ray.aar)" -gt 1000000

      - name: Apply SASAN VPN custom name, app ID and icon
        shell: bash
        run: |
          python3 sasan-xray/scripts/rebrand.py upstream
          grep -F 'applicationId = "com.sasanvpn.xray"' upstream/V2rayNG/app/build.gradle.kts
          grep -F '<string name="app_name" translatable="false">SASAN VPN</string>' upstream/V2rayNG/app/src/main/res/values/strings.xml

      - name: Build signed test APK (not production signed)
        shell: bash
        working-directory: upstream/V2rayNG
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Collect universal Android APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find upstream/V2rayNG/app/build/outputs/apk -type f -name '*.apk' -printf '%p\n'
          apk="$(find upstream/V2rayNG/app/build/outputs/apk -type f -name '*universal*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Universal APK not generated"; exit 1
          fi
          cp "$apk" output/SASAN-Xray-VPN-Android-test.apk
          sha256sum output/SASAN-Xray-VPN-Android-test.apk > output/SASAN-Xray-VPN-Android-test.sha256
          test -s output/SASAN-Xray-VPN-Android-test.apk
          ls -lh output

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SASAN-Xray-VPN-Android-test
          path: output/
          if-no-files-found: error
          retention-days: 7
