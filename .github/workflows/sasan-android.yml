name: SASAN VPN Android APK (test)
# Test builds are intentionally unsigned for production distribution.
# Gradle's debug signing fallback is used by upstream for missing local keys.
on:
  push:
    branches:
      - feature/sasan-vpn-android-starter
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.*"
      - "Makefile"
      - "dependencies.properties"
      - ".github/workflows/sasan-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sasan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-test-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IS_GITHUB_ACTIONS: "1"
    steps:
      - name: Checkout the source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sasan-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            sasan-gradle-${{ runner.os }}-

      - name: Prepare Flutter dependencies and Android VPN core
        env:
          CHANNEL: prod
        run: make android-apk-prepare

      - name: Build Android production-mode test APK
        env:
          CHANNEL: prod
        # No private credentials are embedded. Signed with the standard Android
        # debug signing fallback when no private signing keys are configured.
        run: flutter build apk --release --target lib/main_prod.dart

      - name: Verify build output
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SASAN-VPN-SHA256.txt
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK as private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SASAN-VPN-Android-test
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SASAN-VPN-SHA256.txt
          if-no-files-found: error
          retention-days: 7
