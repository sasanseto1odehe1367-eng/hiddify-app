name: SASAN VPN Xray Android (test)

on:
  push:
    branches:
      - feature/sasan-xray-vpn-android
    paths:
      - 'sasan-xray/**'
      - '.github/workflows/sasan-xray.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sasan-xray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Xray Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout SASAN build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned v2rayNG source and submodules
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: 0f961c54c8c9f85c5271778653340025d33772cc
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform, build tools, and NDK
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build HEV TUN native libraries from pinned sources
        working-directory: upstream
        run: bash compile-hevtun.sh

      - name: Install native HEV libraries
        run: cp -r upstream/libs upstream/V2rayNG/app/

      - name: Download Xray Android AAR with SHA-256 verification
        run: |
          mkdir -p upstream/V2rayNG/app/libs
          curl --fail --location --retry 3 --retry-delay 3 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.21/libv2ray.aar \
            -o upstream/V2rayNG/app/libs/libv2ray.aar
          echo 'e56ec3b06485fe7b37af26948673951edf719c50d6bbc618b8539045952adde4  upstream/V2rayNG/app/libs/libv2ray.aar' | sha256sum -c -

      - name: Apply SASAN VPN branding without changing native Kotlin packages
        run: python3 sasan-xray/scripts/rebrand.py upstream

      - name: Validate expected branding
        run: |
          grep -F 'applicationId = "com.sasanvpn.xray"' upstream/V2rayNG/app/build.gradle.kts
          grep -F '<string name="app_name" translatable="false">SASAN VPN</string>' upstream/V2rayNG/app/src/main/res/values/strings.xml
          test -s upstream/V2rayNG/app/src/main/res/drawable/sasan_vpn_icon.xml

      - name: Run unit tests and build Android debug APK
        working-directory: upstream/V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest :app:assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Check Android APK exists and make checksum
        run: |
          find upstream/V2rayNG/app/build/outputs/apk -name '*.apk' -type f -print
          mkdir -p dist
          APK=$(find upstream/V2rayNG/app/build/outputs/apk/playstore/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK" && test -s "$APK"
          cp "$APK" dist/SASAN-Xray-Android-debug.apk
          (cd dist && sha256sum SASAN-Xray-Android-debug.apk > SHA256SUMS.txt)

      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: SASAN-Xray-Android-test
          path: dist/
          if-no-files-found: error
          retention-days: 7
